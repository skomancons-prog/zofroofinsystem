<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </radialGradient>
    
    <!-- Primary Navy Gradients -->
    <linearGradient id="navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="40%" stop-color="#14304A"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>

    <!-- Light Steel Blue Gradient -->
    <linearGradient id="steel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A75A0"/>
      <stop offset="50%" stop-color="#80A5CD"/>
      <stop offset="100%" stop-color="#3B5D82"/>
    </linearGradient>

    <!-- Inner Glow/Shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#002D54" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-glow)" filter="url(#soft-shadow)" />

  <!-- Outer Navy Blue Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#navy-grad)" stroke-width="12" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#navy-grad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Inner Navy Circle Frame -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#navy-grad)" stroke-width="4" />

  <!-- ================= ROOF AND PEAKS GROUP ================= -->
  <g transform="translate(0, -6)">
    <!-- Center Peak: (256, 120), Left Peak: (180, 160), Right Peak: (332, 160) -->
    <!-- Three Overlapping Peaks (Background shadows / Navy Base) -->
    <path d="M 120 205 
             L 180 160 
             L 210 182 
             L 256 120 
             L 305 162 
             L 320 150 
             L 320 160 
             L 332 163 
             L 332 170 
             L 340 178 
             M 340 178 
             L 388 205 
             L 372 215 
             L 332 185 
             L 295 215 
             L 256 182 
             L 212 215 
             L 180 185 
             L 140 215 Z" 
          fill="url(#navy-grad)" />

    <!-- Sharp Steel/White Highlights and Ridges for 3D Roofing effect -->
    <!-- Left Peak Ridge Highlights -->
    <path d="M 125 200 L 180 162 L 215 188" fill="none" stroke="url(#steel-grad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 135 200 L 180 168 L 205 188" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Center Peak Ridge Highlights -->
    <path d="M 200 193 L 256 124 L 312 193" fill="none" stroke="url(#steel-grad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 210 193 L 256 132 L 302 193" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Right Peak Ridge Highlights -->
    <path d="M 292 188 L 332 162 L 382 200" fill="none" stroke="url(#steel-grad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 302 188 L 332 168 L 372 200" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    
    <!-- Chimney on Right Peak -->
    <rect x="339" y="145" width="14" height="25" fill="url(#navy-grad)" stroke="url(#steel-grad)" stroke-width="1.5" />
    <polygon points="337,145 355,145 351,142 341,142" fill="url(#steel-grad)" />

    <!-- Crown Above center roof peak -->
    <!-- Crown at center (256, 95) -->
    <path d="M 238 95 
             L 243 110 
             L 256 100 
             L 269 110 
             L 274 95 
             L 268 116 
             L 244 116 Z" 
          fill="url(#navy-grad)" />
    <!-- Crown Circles -->
    <circle cx="238" cy="94" r="2.5" fill="url(#navy-grad)" />
    <circle cx="256" cy="99" r="2.5" fill="url(#navy-grad)" />
    <circle cx="274" cy="94" r="2.5" fill="url(#navy-grad)" />
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- ZOF ROOFING text -->
  <text x="256" y="246" 
        font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="45" 
        letter-spacing="1"
        fill="url(#navy-grad)" 
        text-anchor="middle">ZOF ROOFING</text>

  <!-- SYSTEM LTD. text -->
  <text x="256" y="286" 
        font-family="'Inter', 'Montserrat', 'Arial', sans-serif" 
        font-weight="800" 
        font-size="30" 
        letter-spacing="5"
        fill="url(#navy-grad)" 
        text-anchor="middle">SYSTEM LTD.</text>

  <!-- ================= SATISFACTION SHIELD / BADGE ================= -->
  <g transform="translate(0, 16)">
    <!-- Outer Shield Crest Group centered at X=256, Y=330 -->
    <!-- Shield Outline -->
    <path d="M 226 312 
             L 286 312 
             L 289 328
             Q 289 368 256 384
             Q 223 368 223 328 Z" 
          fill="url(#navy-grad)" />

    <path d="M 229 315 
             L 283 315 
             L 286 328
             Q 286 365 256 380
             Q 226 365 226 328 Z" 
          fill="#ffffff" />
          
    <path d="M 232 318 
             L 280 318 
             L 283 328
             Q 283 362 256 376
             Q 229 362 229 328 Z" 
          fill="url(#navy-grad)" />

    <!-- Ribbon banner draping behind/under shield -->
    <!-- Left side of Ribbon -->
    <polygon points="184,352 216,334 216,356 184,372" fill="#132a4e" />
    <polygon points="184,372 196,362 184,352" fill="none" stroke="url(#navy-grad)" stroke-width="2" />
    <!-- Right side of Ribbon -->
    <polygon points="328,352 296,334 296,356 328,372" fill="#132a4e" />
    <polygon points="328,372 316,362 328,352" fill="none" stroke="url(#navy-grad)" stroke-width="2" />

    <!-- Core Banner Plate -->
    <rect x="198" y="334" width="116" height="20" rx="3" fill="url(#navy-grad)" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Text on Banner: "SATISFACTION" -->
    <text x="256" y="348" 
          font-family="'Inter', 'Montserrat', sans-serif" 
          font-weight="900" 
          font-size="9" 
          fill="#ffffff" 
          letter-spacing="0.8"
          text-anchor="middle">SATISFACTION</text>

    <!-- Small crown in Shield upper part -->
    <path d="M 248 322 L 250 326 L 256 323 L 262 326 L 264 322 L 260 329 L 252 329 Z" fill="#ffffff" />
    
    <!-- Text ★ 100% ★ -->
    <text x="256" y="332" 
          font-family="'Inter', 'Montserrat', sans-serif" 
          font-weight="900" 
          font-size="8" 
          fill="#ffffff" 
          text-anchor="middle">★ 100% ★</text>

    <!-- Text under Banner inside Shield: "GUARANTEED" -->
    <text x="256" y="364" 
          font-family="'Inter', 'Montserrat', sans-serif" 
          font-weight="900" 
          font-size="9" 
          fill="#ffffff" 
          letter-spacing="0.5"
          text-anchor="middle">GUARANTEED</text>

    <!-- Star at the shield bottom tip -->
    <polygon points="256,368 258,371 261,371 259,373 260,376 256,374 252,376 253,373 251,371 254,371" fill="#ffffff" />
  </g>
</svg>
